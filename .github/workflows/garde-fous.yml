name: garde-fous

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  branche:
    runs-on: ubuntu-24.04
    steps:
      - name: Nom de branche
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in main | develop) exit 0 ;; esac
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feature|fix|refactor|hotfix|docs)/lec-[0-9]+(-[a-z0-9]+)+$'; then
            echo "::error::Branche $BRANCH : format attendu <type>/lec-<numéro>-<titre>, par exemple feature/lec-12-ingestion-ventes"
            exit 1
          fi

  fichiers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Échantillon client et fichiers lourds
        run: scripts/controle-fichiers.sh HEAD

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets dans l'historique
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
